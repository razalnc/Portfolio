<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&amp;family=Great+Vibes&amp;family=Montserrat:wght@400;500;600;700;800&amp;family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&amp;display=swap');
      .inst-title { font-family: 'Cinzel', serif; font-weight: 900; font-size: 26px; fill: #0b192c; letter-spacing: 1.5px; text-anchor: middle; }
      .inst-sub { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 13px; fill: #1e3a8a; letter-spacing: 2px; text-anchor: middle; }
      .cert-no { font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 600; fill: #334155; }
      .main-head { font-family: 'Playfair Display', serif; font-weight: 800; font-size: 38px; fill: #0f172a; letter-spacing: 6px; text-anchor: middle; }
      .main-head-sub { font-family: 'Cinzel', serif; font-weight: 700; font-size: 24px; fill: #1e293b; letter-spacing: 4px; text-anchor: middle; }
      .body-text { font-family: 'Montserrat', sans-serif; font-size: 15px; fill: #1e293b; line-height: 1.8; }
      .handwriting { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; font-size: 19px; fill: #000000; }
      .sig-hand { font-family: 'Great Vibes', cursive; font-size: 28px; fill: #0f172a; }
      .sig-label { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 13px; fill: #334155; }
    </style>
    
    <pattern id="bg-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="#f1f5f9" stroke-width="0.5"/>
    </pattern>

    <!-- Watermark Logo -->
    <g id="watermark">
      <circle cx="500" cy="370" r="160" fill="none" stroke="#e2e8f0" stroke-width="12" opacity="0.4"/>
      <circle cx="500" cy="370" r="140" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.15"/>
      <text x="500" y="380" font-family="'Cinzel', serif" font-weight="900" font-size="110" fill="#2563eb" opacity="0.06" text-anchor="middle">RCSH</text>
    </g>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="700" fill="#fdfbf7" />
  <rect width="1000" height="700" fill="url(#bg-pattern)" />

  <!-- Outer Double Border with Corner Accents -->
  <rect x="20" y="20" width="960" height="660" fill="none" stroke="#0f172a" stroke-width="3"/>
  <rect x="26" y="26" width="948" height="648" fill="none" stroke="#0f172a" stroke-width="1"/>
  <rect x="34" y="34" width="932" height="632" fill="none" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4 2"/>

  <!-- Ornate Corner Frames -->
  <g stroke="#0f172a" stroke-width="1.5" fill="none">
    <!-- Top Left -->
    <path d="M 20 50 L 50 50 L 50 20" />
    <circle cx="40" cy="40" r="4" fill="#0f172a" />
    <!-- Top Right -->
    <path d="M 980 50 L 950 50 L 950 20" />
    <circle cx="960" cy="40" r="4" fill="#0f172a" />
    <!-- Bottom Left -->
    <path d="M 20 650 L 50 650 L 50 680" />
    <circle cx="40" cy="660" r="4" fill="#0f172a" />
    <!-- Bottom Right -->
    <path d="M 980 650 L 950 650 L 950 680" />
    <circle cx="960" cy="660" r="4" fill="#0f172a" />
  </g>

  <!-- Watermark -->
  <use href="#watermark"/>

  <!-- Top Emblem / Logo -->
  <g transform="translate(360, 55)">
    <circle cx="24" cy="24" r="22" fill="#1e3a8a"/>
    <circle cx="24" cy="24" r="18" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M 16 28 L 24 14 L 32 28 M 20 23 L 28 23" stroke="#ffffff" stroke-width="2" fill="none"/>
  </g>

  <!-- Institution Header -->
  <text x="515" y="75" class="inst-title">REGIONAL COLLEGE</text>
  <text x="515" y="94" font-family="'Cinzel', serif" font-weight="700" font-size="14" fill="#1e293b" letter-spacing="1px" text-anchor="middle">OF SCIENCE AND HUMANITIES</text>
  <text x="515" y="112" class="inst-sub">— HARITHAGIRI, KIZHISSERI —</text>

  <!-- Certificate No -->
  <text x="710" y="85" class="cert-no">CERTIFICATE NO: <tspan font-family="'Playfair Display', serif" font-style="italic">RCSH/WD/2026/015</tspan></text>
  <line x1="825" y1="88" x2="940" y2="88" stroke="#475569" stroke-width="1"/>

  <!-- Decorative Line under Header -->
  <path d="M 120 130 L 880 130" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 450 130 L 550 130" stroke="#1e3a8a" stroke-width="3"/>

  <!-- Ornate Title Header -->
  <g transform="translate(500, 185)">
    <!-- Filigree Top -->
    <path d="M -120 -30 Q -60 -45 0 -25 Q 60 -45 120 -30" fill="none" stroke="#1e3a8a" stroke-width="1.5"/>
    <circle cx="0" cy="-25" r="3" fill="#1e3a8a"/>

    <text x="0" y="0" class="main-head">CERTIFICATE</text>
    <text x="0" y="32" class="main-head-sub">OF COMPLETION</text>

    <!-- Filigree Bottom -->
    <path d="M -120 48 Q -60 62 0 42 Q 60 62 120 48" fill="none" stroke="#1e3a8a" stroke-width="1.5"/>
    <circle cx="0" cy="43" r="3" fill="#1e3a8a"/>
  </g>

  <!-- Body Content -->
  <g transform="translate(100, 290)" class="body-text">
    <!-- Line 1 -->
    <text x="0" y="0">This is to certify that Mr./Ms. <tspan class="handwriting">RAZAL N.C.</tspan></text>
    <line x1="225" y1="4" x2="780" y2="4" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Line 2 -->
    <text x="0" y="40">Register Number : <tspan class="handwriting">RCAYSCO15</tspan></text>
    <line x1="145" y1="44" x2="400" y2="44" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Line 3 -->
    <text x="0" y="80">has successfully completed the Add-On Course in <tspan font-family="'Montserrat', sans-serif" font-weight="800" font-size="16" fill="#0f172a">WEB DESIGNING</tspan> conducted by the Department of</text>
    <line x1="380" y1="84" x2="540" y2="84" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Line 4 -->
    <text x="0" y="115">Computer Science, Regional College of Science and Humanities, Kizhisseri during the academic year</text>

    <!-- Line 5 -->
    <text x="0" y="150"><tspan class="handwriting">2025 – 2026</tspan>. He/She has fulfilled all the requirements prescribed for the course and has successfully passed</text>

    <!-- Line 6 -->
    <text x="0" y="185">the examination.</text>

    <!-- Line 7 -->
    <text x="0" y="220">We appreciate his/her dedication and wish him/her every success in future endeavors.</text>
  </g>

  <!-- Bottom Section: Date, Stamp, Signatures -->
  <g transform="translate(100, 560)">
    <!-- Left: Date & Place -->
    <text x="0" y="0" font-family="'Montserrat', sans-serif" font-size="14" font-weight="600" fill="#0f172a">Date: <tspan font-weight="700">11/3/2026</tspan></text>
    <text x="0" y="22" font-family="'Montserrat', sans-serif" font-size="14" font-weight="600" fill="#0f172a">Place: <tspan font-weight="700">Kizhisseri</tspan></text>
    
    <!-- Signature Coordinator -->
    <path d="M 0 55 C 20 40, 30 70, 50 45 C 70 30, 80 65, 100 50" fill="none" stroke="#0f172a" stroke-width="2"/>
    <line x1="0" y1="65" x2="160" y2="65" stroke="#64748b" stroke-width="1"/>
    <text x="0" y="82" class="sig-label">Course Coordinator</text>
  </g>

  <!-- Center Seal Stamp -->
  <g transform="translate(500, 600)">
    <circle cx="0" cy="0" r="46" fill="none" stroke="#1e3a8a" stroke-width="2.5" stroke-dasharray="6 3"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#1e3a8a" stroke-width="1"/>
    <circle cx="0" cy="0" r="32" fill="#eff6ff" opacity="0.8"/>
    
    <path id="seal-text-path-top" d="M -32 0 A 32 32 0 0 1 32 0" fill="none"/>
    <text font-family="'Montserrat', sans-serif" font-size="7" font-weight="800" fill="#1e3a8a" text-anchor="middle">
      <textPath href="#seal-text-path-top" startOffset="50%">REGIONAL COLLEGE OF SCIENCE</textPath>
    </text>
    
    <text x="0" y="4" font-family="'Cinzel', serif" font-size="9" font-weight="800" fill="#1e3a8a" text-anchor="middle">OFFICIAL</text>
    <text x="0" y="14" font-family="'Montserrat', sans-serif" font-size="7" font-weight="700" fill="#1e3a8a" text-anchor="middle">SEAL • KIZHISSERI</text>
    <text x="0" y="25" font-family="'Montserrat', sans-serif" font-size="8" font-weight="700" fill="#1e3a8a" text-anchor="middle">College Seal</text>
  </g>

  <!-- Right: Principal Signature -->
  <g transform="translate(740, 560)">
    <path d="M 20 50 C 10 30, 40 20, 30 60 C 50 40, 70 30, 90 45" fill="none" stroke="#0f172a" stroke-width="2"/>
    <line x1="0" y1="65" x2="160" y2="65" stroke="#64748b" stroke-width="1"/>
    <text x="80" y="78" class="sig-label" text-anchor="middle">PRINCIPAL</text>
    <text x="80" y="92" font-family="'Montserrat', sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Regional College of Science &amp; Humanities</text>
    <text x="80" y="104" font-family="'Montserrat', sans-serif" font-size="9" font-weight="500" fill="#64748b" text-anchor="middle">Kizhisseri, Malappuram Dt. Pin: 673641</text>
  </g>

</svg>
